name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.rst'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: "pytest on ${{ matrix.os }} / ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Test with pytest
        run: uv run pytest tests --cov=pysec -vv
      - name: Rename coverage data file
        if: runner.os == 'Linux'
        run: mv .coverage ".coverage.${{ matrix.python-version }}"
      - name: Upload coverage data
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data.${{ matrix.python-version }}
          path: .coverage.*
          if-no-files-found: ignore
          include-hidden-files: true

  codestyle:
    name: Check code style issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint with ruff
        run: |
          uv run ruff --version
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check with mypy
        run: uv run mypy pysec
      - name: Check with pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  package:
    name: Build & verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv build
      - run: ls -l dist
      - name: Test installing package
        working-directory: /tmp
        run: |
          uv venv
          uv pip install "$GITHUB_WORKSPACE"/dist/*.whl
          .venv/bin/python -c "import pysec; print(pysec.__version__)"

  coverage:
    name: Combine & check coverage
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-data*
          merge-multiple: true
      - name: Combine coverage & create xml report
        run: |
          uvx coverage combine
          uvx coverage xml
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
